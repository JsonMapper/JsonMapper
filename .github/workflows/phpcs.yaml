name: "CodeStyle"

on:
  pull_request:
    paths:
      - "**.php"
      - "composer.json"
      - "phpcs.xml.dist"
      - ".github/workflows/phpcs.yaml"

jobs:
  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        coverage: none
        tools: cs2pr

    - name: Install dependencies
      run: composer install --no-interaction --no-progress

    # cs2pr turns the checkstyle report into inline annotations on the pull request
    - name: Run PHP_CodeSniffer
      run: composer phpcs -- -q --report=checkstyle | cs2pr
